name: sdk-java Release

on:
  pull_request:
    types: [closed]
    paths:
      - '.github/project.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: release
    if: ${{ github.event.pull_request.merged == true }}
    env:
      MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

    steps:
      - uses: radcortez/project-metadata-action@main
        name: Retrieve project metadata
        id: metadata
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          metadata-file-path: '.github/project.yml'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: GPG sanity check
        run: |
          gpg --list-secret-keys --keyid-format LONG
          echo "test" | gpg --batch --yes --pinentry-mode loopback \
          --passphrase "$MAVEN_GPG_PASSPHRASE" \
          --local-user "$MAVEN_GPG_FINGERPRINT" \
          --clearsign > /dev/null

      - name: Configure Git author
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Maven release ${{steps.metadata.outputs.current-version}}
        run: |
          git checkout -b release
          mvn -B release:prepare -Prelease -DreleaseVersion=${{steps.metadata.outputs.current-version}} -DdevelopmentVersion=${{steps.metadata.outputs.next-version}}
          
          git restore --staged --worktree -- impl/test/db-samples/** 2>/dev/null || true
          git clean -fd -- impl/test/db-samples 2>/dev/null || true
    
          git status --porcelain
          cat release.properties
          git checkout ${{github.base_ref}}
          git rebase release
          mvn -B release:perform -DperformRelease=true -Prelease

      - name: Push tags
        run: git push && git push --tags
