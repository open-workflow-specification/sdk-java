document:
  dsl: '1.0.2'
  namespace: test
  name: call-custom-function-cataloged
  version: '0.1.0'
do:
  - log:
      call: https://raw.githubusercontent.com/open-workflow-specification/catalog/refs/heads/main/functions/log/1.0.0/function.yaml
      with:
        message: Hello, world!
        level: information
        timestamp: true
        format: '{TIMESTAMP} [{LEVEL}] ({CONTEXT}): {MESSAGE}'