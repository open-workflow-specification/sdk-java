document:
  dsl: '1.0.0'
  namespace: test
  name: try-catch-retry-inline-then
  version: '0.1.0'
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              method: get
              endpoint: http://localhost:9797
              redirect: true
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/1.0.0/errors/communication
            status: 404
        then:
            endGracefully
        retry:
          delay:
            milliseconds: 10
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 5
  - failWontHappen:
          raise:
            error:
              type: https://open-workflow-specification.org/1.0.0/errors/runtime
              status: 500
  - endGracefully:
           set:
            recovered: true
