document:
  dsl: 1.0.0-alpha5
  namespace: test
  name: call-http-shorthand-endpoint
  version: '0.1.0'
do:
  - tryGetPet:
      try:
      - getPet:
          call: http
          with:
            headers:
              content-type: application/json
            method: get
            endpoint: ${ "http://localhost:9876/pets/\(.petId)" }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/1.0.0/errors/communication
            status: 404