document:
  dsl: '1.0.0'
  namespace: test
  name: try-catch-retry-attempt-duration-overall
  version: '0.1.0'
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              method: get
              endpoint: http://localhost:9797
              redirect: true
      catch:
        errors:
          with:
            type: https://serverlessworkflow.io/spec/1.0.0/errors/timeout
            status: 408
        retry:
          delay:
            milliseconds: 10
          backoff:
            constant: {}
          limit:
            duration:
                milliseconds: 100
            attempt:
              count: 5
              duration:
                milliseconds: 50