document:
  dsl: 1.0.0-alpha1
  namespace: test
  name: call-http-with-response-headers
  version: 1.0.0
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              headers:
                content-type: application/json
              method: get
              output: response
              endpoint: 
                uri: http://localhost:9876/pets/{petId}
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 404